<html Lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>POST Form Data as JSON with JavaScript Fetch API</title>
        <link rel="stylesheet" href="style.css">

    </head>
<body>
    <!-- Area de encabezados fijos -->
    <!-- close the browser and start it with the --disable-web-security and --user-data-dir flags-->   
    
    <center><img src="addticke.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Agregar Ticket</h2>
    </center>

    <!-- Formulario para enviar los datos -->    
    <center>
    <form class="form" method="POST" >
        <br>
        <table>
            <tr >
                <td><label for="descripcion" class="form-label">Descripción</label></td>
            </tr>
            <tr>
                <td><textarea id="descripcion" class="txt" name="descripcion" placeholder="Describa el problema" rows="5" required></textarea></td>
            </tr>

            <tr><td><span id="resultado1"></span></td></tr>
            <tr><td><br></td></tr>

        </table>
        
        <button id="submit-btn" type="submit">Agregar Ticket</button>
        <button id="backToTickets" type="button" hidden>Volver a listar tickets</button>
        
    <p> </p>
    </form>
    <p>¡Todo lo que Ud. diga o haga en éste sistema podrá ser usado en su contra!</p>
    </center>

    <!-- Area para crear contenido dinámico -->
    
    <div id="app"></div>
    <ul id="listado"></ul>
    
    <!-- Script a ser ejecutado --> 
    <script src="addTicket.js" type="module"></script>
    

</body>
