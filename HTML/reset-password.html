<html Lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>POST Form Data as JSON with JavaScript Fetch API</title>

        <style type="text/css"> 
  
            label { 
              font-size: 18px; 
            } 
            form {
                width: 500px;
                border: 1px solid black; 
            }
            input { 
              margin: 7px; 
              padding: 2px 
            } 
            .form-label{
                margin-bottom:0!important;
            }     
            .txt {
                display: inline-block;
                  width: 80%;
                  outline: none;
                margin:0;
            }
        </style> 
    </head>
<body>
    <!-- Area de encabezados fijos -->
    <!-- close the browser and start it with the --disable-web-security and --user-data-dir flags-->
    <center><img src="passreset.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Recuperación de Contraseña</h2>
    </center>

    <!-- Formulario para enviar los datos -->    
    <center>
    <form class="form" method="POST" style="background-color:#d8f7cf" width="100px" border="1">
        <br>
        <!-- <center><h4>Ingrese su identificación de usuario y password</h4></center> -->
        <table>
            
            <tr style="height:10px;">
                <td><label for="contacto" class="form-label">Correo Electrónico</label></td>               
            </tr>
             <tr style="height:10px;">    
                <td><input id="contacto" class="txt" name="contacto" type="email" placeholder="Correo Electrónico" required><br></td>
            </tr>
            <tr><td>&nbsp;</td></tr>

            <tr style="height:10px;">   
                <td><label for="password1" class="form-label">Nueva Contraseña</label></td>               
            </tr>
             <tr style="height:10px;">    
                <td><input id="password1" class="password" name="password1" type="password" placeholder="Nueva Contraseña" required><br></td>
            </tr>
            <tr><td>&nbsp;</td></tr>
            
            <tr style="height:10px;">
                <td><label for="password2" class="form-label">Confirmar Nueva Contraseña</label></td>               
            </tr>
             <tr style="height:10px;">    
                <td><input id="password2" class="password" name="password2" type="password" placeholder="Confirmar Nueva Contraseña" required><br></td>
            </tr>
            <tr><td>&nbsp;</td></tr>

            <tr><td><span id="resultado1"></span></td></tr>
            <tr><td><br></td></tr>
    
            <tr>
                <td><center><span>¿Ya tienes una cuenta? </span><a href="loginClient.html">Inicia sesión</a></center></td>
            </tr>

        </table>
        
        <button type="submit">Cambiar contraseña</button>
        
        
    <p> </p>
    </form>
    <p>¡Todo lo que Ud. diga o haga en éste sistema podrá ser usado en su contra!</p>
    </center>

    <!-- Area para crear contenido dinámico -->
    
    <div id="app"></div>
    <ul id="listado"></ul>
    
    <!-- Script a ser ejecutado --> 
    <script src="reset-password.js" type="module"></script>
    

</body>
